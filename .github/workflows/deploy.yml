name: Deploy
on:
  release:
    types: [created]
  push:
    branches:
      - main
      - zizmor
  pull_request:
    branches:
      - main
      - zizmor
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  release:
    permissions:
      contents: write # Required by `gh release upload`
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    name: Deploy ${{ matrix.target }}
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      run: ci/install-rust.sh stable ${TARGET}
      env:
        TARGET: ${{ matrix.target }}
    - name: Build asset
      run: ci/make-release-asset.sh ${OS} ${TARGET}
      env:
        OS: ${{ matrix.os }}
        TARGET: ${{ matrix.target }}
    - name: Update release with new asset
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload $MDBOOK_TAG $MDBOOK_ASSET
  pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # The `publish-guide.sh` script requires this for `git push`
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: true # The `publish-guide.sh` script requires this for `git push`
    - name: Install Rust (rustup)
      run: rustup update stable --no-self-update && rustup default stable
    - name: Deploy the User Guide to GitHub Pages using the gh-pages branch
      run: ci/publish-guide.sh
